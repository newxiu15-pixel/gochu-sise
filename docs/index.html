<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<!-- 화면을 고쳤을 때 폰에 옛 화면이 남지 않게 -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>고추 시세</title>
<style>
  :root {
    --ink: #111;
    --gray: #777;
    --line: #e3e3e3;
    --up: #c62828;
    --down: #1565c0;
    --soft: #f6f6f6;
  }
  * { box-sizing: border-box; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0 auto;
    padding: 0 16px 56px;
    max-width: 480px;
    background: #fff;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif;
    font-size: 17px;
    line-height: 1.5;
    font-variant-numeric: tabular-nums;   /* 숫자 폭을 맞춰 세로줄이 흐트러지지 않게 */
  }

  /* ── 1. 날짜 ───────────────────────────── */
  /* 시세 날짜와 확인 날짜를 나란히 둔다. 두 날짜를 견주면 갱신 여부가 바로 보인다. */
  header { padding: 22px 0 4px; }
  /* 도장 테두리를 굵히면서 좁은 폰(320px)에서 한 줄에 안 들어가 날짜를 줄였다. */
  .head-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .date { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.25; }
  .stamp {
    flex: none;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.3;
    padding: 5px 9px;
    border-radius: 8px;
    border: 3px solid var(--line);    /* 갱신 여부가 한눈에 들어오게 굵게 */
    color: var(--gray);
  }
  .stamp b { display: block; font-size: 14px; font-weight: 700; }
  .stamp.fresh { border-color: #1b5e20; color: #1b5e20; background: #f1f8f2; }
  .stamp.stale { border-color: #e0a800; color: #8a6600; background: #fff8e1; }
  .sub-head { font-size: 15px; color: var(--gray); margin-top: 4px; }

  /* ── 구역 나누기 ───────────────────────── */
  section { margin-top: 26px; }
  .label {
    font-size: 14px;
    font-weight: 700;
    color: var(--gray);
    letter-spacing: 1px;
    margin-bottom: 9px;
  }

  /* ── 2. 품종 고르기 ─────────────────────── */
  .picker { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .picker button {
    min-height: 56px;              /* 한 줄짜리와 두 줄짜리 높이를 맞춘다 */
    padding: 8px 2px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    background: #fff;
    border: 2px solid var(--line);
    border-radius: 9px;
    cursor: pointer;
    line-height: 1.25;
  }
  .picker button[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
  }

  /* ── 3. 그날 값 ─────────────────────────── */
  .hero { border: 2px solid var(--ink); border-radius: 12px; padding: 18px 16px 0; }
  .hero-kind { font-size: 19px; font-weight: 700; }
  .stale-note { font-size: 15px; color: var(--up); font-weight: 700; margin-top: 2px; }
  .hero-price {
    font-size: 54px;
    font-weight: 700;
    letter-spacing: -2px;
    line-height: 1.1;
    margin: 6px 0 2px;
  }
  .hero-price span { font-size: 24px; font-weight: 500; letter-spacing: 0; margin-left: 3px; }
  .hero-diff { font-size: 19px; font-weight: 700; }
  .hero-diff.up { color: var(--up); }
  .hero-diff.down { color: var(--down); }
  .hero-diff.same { color: var(--gray); }
  .hero-unit { font-size: 16px; color: var(--gray); margin: -2px 0 8px; }
  .hero-prev { font-size: 15px; color: var(--gray); margin-top: 1px; }

  /* 가격끼리만 나란히 둔다. 물량은 성격이 달라 아래 단으로 내린다. */
  .pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    margin: 16px -16px 0;
    border-top: 1px solid var(--line);
  }
  .pair div { padding: 12px 4px; text-align: center; }
  .pair div + div { border-left: 1px solid var(--line); }
  .pair b { display: block; font-size: 21px; font-weight: 700; }
  .pair span { display: block; font-size: 14px; color: var(--gray); margin-top: 1px; }

  .volume {
    margin: 0 -16px;
    padding: 11px 16px;
    border-top: 1px solid var(--line);
    background: var(--soft);
    border-radius: 0 0 10px 10px;
    font-size: 16px;
    color: var(--gray);
    display: flex;
    justify-content: space-between;
  }
  .volume b { color: var(--ink); font-size: 17px; }

  /* ── 4. 판단 ────────────────────────────── */
  .verdict {
    background: var(--soft);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
  }
  .verdict .line1 { font-size: 21px; font-weight: 700; line-height: 1.35; }
  .verdict .line2 { font-size: 16px; color: var(--gray); margin-top: 5px; }
  .verdict .line2 b { color: var(--ink); }

  /* ── 5. 기간과 그래프 ───────────────────── */
  .ranges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-bottom: 12px; }
  .ranges button {
    padding: 11px 2px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    background: #fff;
    border: 2px solid var(--line);
    border-radius: 9px;
    cursor: pointer;
  }
  .ranges button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }

  svg { width: 100%; height: auto; display: block; }
  .quad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border: 1px solid var(--line);
    border-radius: 10px 10px 0 0;
    overflow: hidden;
    margin-top: 10px;
  }
  .quad div { padding: 11px 2px; text-align: center; }
  .quad div + div { border-left: 1px solid var(--line); }
  .quad b { display: block; font-size: 18px; font-weight: 700; }
  .quad span { display: block; font-size: 13px; color: var(--gray); margin-top: 1px; }

  .count {
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-top: 0;
    background: var(--soft);
    font-size: 15px;
    color: var(--gray);
    display: flex;
    justify-content: space-between;
  }
  .count + .count { border-top: 1px solid var(--line); }
  .count.last { border-radius: 0 0 10px 10px; }
  .count b { color: var(--ink); font-size: 16px; }

  .empty {
    padding: 26px 16px;
    border: 2px dashed var(--line);
    border-radius: 10px;
    text-align: center;
    font-size: 17px;
    color: var(--gray);
    line-height: 1.5;
  }
  .empty span { display: block; margin-top: 6px; font-weight: 700; color: var(--ink); }

  /* ── 6. 전체 품종 ───────────────────────── */
  /* 좁은 폰에서 눈이 가로로 헤매지 않게 세 칸까지만 둔다. */
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 13px 1px; font-size: 16px; text-align: right; }
  th { font-size: 13px; font-weight: 500; color: var(--gray); border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
  td { border-bottom: 1px solid var(--line); }
  /* 품종 이름은 라벨이라 조금 작아도 읽힌다. 숫자 넉 줄이 들어갈 자리를 벌어 준다. */
  th:first-child, td:first-child { text-align: left; font-weight: 700; font-size: 15px; }
  td.vol { color: var(--gray); }        /* 물량은 가격과 결이 달라 흐리게 */
  tbody tr { cursor: pointer; }
  tr.on td { background: var(--soft); }
  tr.on td:first-child::before { content: "▸ "; }
  td.up { color: var(--up); font-weight: 700; }
  td.down { color: var(--down); font-weight: 700; }
  td.flat { color: var(--gray); font-size: 16px; }
  td i, .unit-note i {
    font-style: normal;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    background: var(--gray);
    border-radius: 4px;
    padding: 1px 5px;
    vertical-align: 2px;
  }
  .unit-note { font-size: 13px; color: var(--gray); margin-top: 8px; line-height: 1.7; }

  /* ── 경고 ───────────────────────────────── */
  .alert { border-radius: 10px; padding: 16px; font-size: 20px; font-weight: 700; line-height: 1.4; margin-top: 16px; }
  .alert.red { background: var(--up); color: #fff; }
  .alert.yellow { background: #fff3cd; color: var(--ink); border: 2px solid #e0a800; }
  .alert .tell { display: block; font-size: 18px; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.45); }
  .alert.yellow .tell { border-top-color: #e0a800; }
  .alert .why { display: block; font-size: 14px; font-weight: 500; margin-top: 7px; opacity: .85; }

  footer { margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--gray); }
</style>
</head>
<body>
<div id="app"><p style="padding:40px 0;font-size:19px">시세를 불러오는 중입니다…</p></div>

<script>
"use strict";

// 긴 품종 이름은 버튼에 안 들어간다. 짧게 줄여 쓴다.
var SHORT = {
  "화건 손꼭무(노지)": "손꼭무<br>노지",
  "화건 손꼭무(하우스)": "손꼭무<br>하우스",
  "화건 꼭무": "꼭무",
  "화건": "화건",
  "청양(손꼭무, 꼭무)": "청양<br>꼭무",
  "청양": "청양",
  "양건": "양건",
  "홍고추": "홍고추",
  "홍고추 손꼭무": "홍고추<br>꼭무",
  "홍청양": "홍청양"
};
// 표에 쓸 한 줄 이름
var FLAT = {
  "화건 손꼭무(노지)": "손꼭무 노지",
  "화건 손꼭무(하우스)": "손꼭무 하우스",
  "청양(손꼭무, 꼭무)": "청양 꼭무",
  "홍고추 손꼭무": "홍고추 꼭무"
};
// 아버지가 자주 내는 품종(꼭무·화건)을 맨 앞에 둔다.
var ORDER = ["화건 꼭무", "화건", "화건 손꼭무(노지)", "화건 손꼭무(하우스)",
             "청양(손꼭무, 꼭무)", "청양", "양건", "홍고추", "홍고추 손꼭무", "홍청양"];
var RANGES = [{ key: 7, label: "일주일" }, { key: 30, label: "한 달" },
              { key: 90, label: "석 달" }, { key: 365, label: "1년" }];
var WEEKDAY = ["일", "월", "화", "수", "목", "금", "토"];

var state = { days: null, dates: [], marketName: "", updated: "", status: null, kind: null, range: 30 };

// 한번 고른 품종은 폰에 남겨둔다. 다음에 열면 바로 그 품종이 뜬다.
function remember(key, value) {
  try { localStorage.setItem("gochu." + key, value); } catch (e) { /* 저장이 막혀도 그냥 넘어간다 */ }
}
function recall(key) {
  try { return localStorage.getItem("gochu." + key); } catch (e) { return null; }
}
function pick(kind) { state.kind = kind; remember("kind", kind); render(); }

function won(n) { return n == null ? "-" : n.toLocaleString("ko-KR"); }
function shortName(k) { return SHORT[k] || k; }
function flatName(k) { return FLAT[k] || k; }

function fmtDate(iso) {
  var d = new Date(iso + "T00:00:00+09:00");
  return (d.getMonth() + 1) + "월 " + d.getDate() + "일 (" + WEEKDAY[d.getDay()] + ")";
}

// 요일을 뺀 짧은 날짜. 주말·공휴일에 '오늘'이라고 쓰면 틀린 말이 되므로 어디서나 날짜로 적는다.
function fmtDay(iso) {
  var d = new Date(iso + "T00:00:00+09:00");
  return (d.getMonth() + 1) + "월 " + d.getDate() + "일";
}

function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }

// 경매는 평일에만 선다. 주말을 빼고 세야 헛경고가 안 뜬다.
function weekdaysBetween(a, b) {
  var d = new Date(a + "T00:00:00Z"), end = new Date(b + "T00:00:00Z"), n = 0;
  while (d < end) {
    d.setUTCDate(d.getUTCDate() + 1);
    var w = d.getUTCDay();
    if (w !== 0 && w !== 6) n++;
  }
  return n;
}

function today() { return new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10); }

// 며칠 전인지에 따라 말을 고른다. '지난 경매'처럼 뭉뚱그리면 언제인지 알 수 없다.
function relDay(iso) {
  var gap = daysBetween(iso, today());
  if (gap === 0) return fmtDay(iso);
  if (gap === 1) return "어제 " + fmtDay(iso);
  if (gap === 2) return "그저께 " + fmtDay(iso);
  // 해가 넘어간 값은 연도를 밝힌다. 안 그러면 작년 10월을 올해로 본다.
  if (iso.slice(0, 4) !== today().slice(0, 4)) return iso.slice(0, 4) + "년 " + fmtDay(iso);
  return fmtDate(iso);
}

// 해당 품종의 [날짜, 평균가, 원본] 목록. 거래가 없던 날은 빠진다.
function series(kind, withinDays) {
  var last = state.dates[state.dates.length - 1];
  var out = [];
  state.dates.forEach(function (d) {
    if (withinDays && daysBetween(d, last) > withinDays) return;
    var v = state.days[d][kind];
    if (v && v.avg != null) out.push([d, v.avg, v]);
  });
  return out;
}

function kindsAvailable() {
  var seen = {};
  state.dates.slice(-40).forEach(function (d) {
    Object.keys(state.days[d]).forEach(function (k) { seen[k] = true; });
  });
  var list = ORDER.filter(function (k) { return seen[k]; });
  Object.keys(seen).forEach(function (k) { if (list.indexOf(k) < 0) list.push(k); });
  return list;
}

// 이 품종이 근 단위인지 kg 단위인지
function unitOf(kind) {
  var s = series(kind, 0);
  return s.length ? s[s.length - 1][2].unit : "근";
}

// 직전 경매일 대비 등락
function change(kind) {
  var s = series(kind, 0);
  if (s.length < 2) return null;
  return { diff: s[s.length - 1][1] - s[s.length - 2][1], prevDate: s[s.length - 2][0], prev: s[s.length - 2][1] };
}

// ── 경고 ────────────────────────────────────────────────────
// 아버지가 이상을 눈치채고 아들에게 알릴 수 있도록, 문제는 크고 빨갛게 띄운다.
function alertHTML() {
  var st = state.status || {};
  var last = state.dates[state.dates.length - 1];
  var lastCheck = st.checked ? st.checked.slice(0, 10) : null;
  var tell = '<span class="tell">이 화면을 아들에게 보여주세요</span>';

  if (st.ok === false) {
    return '<div class="alert red">오류 발생 — 프로그램 수정이 필요합니다' + tell +
           '<span class="why">시세를 가져오지 못했습니다. ' + (st.message || "") + "</span></div>";
  }
  if (lastCheck && weekdaysBetween(lastCheck, today()) >= 2) {
    return '<div class="alert red">오류 발생 — 자동 확인이 멈췄습니다' + tell +
           '<span class="why">마지막 확인 ' + fmtDate(lastCheck) + "</span></div>";
  }
  if (st.board === false && st.backup === true) {
    return '<div class="alert red">일부 오류 — 프로그램 수정이 필요합니다' + tell +
           '<span class="why">평균가만 나옵니다. 최고가·최저가를 못 가져오고 있습니다.</span></div>';
  }
  if (weekdaysBetween(last, today()) >= 3) {
    return '<div class="alert yellow">새 시세가 안 올라오고 있습니다' +
           '<span class="why">아래 값은 ' + fmtDate(last) + " 기준입니다. 공휴일이면 정상입니다.</span></div>";
  }
  return "";
}

// 시세 날짜 옆에 붙는 확인 도장. 언제 확인했는지가 한눈에 보여야 갱신 여부를 안다.
function stampHTML() {
  var st = state.status || {};
  if (!st.checked) return '<div class="stamp stale">확인 기록<b>없음</b></div>';

  var d = st.checked.slice(0, 10), hm = st.checked.slice(11, 16);
  var md = (+d.slice(5, 7)) + "/" + (+d.slice(8, 10));
  // 확인이 평일 하루도 안 밀렸으면 초록, 밀렸으면 노랑
  var cls = weekdaysBetween(d, today()) < 1 ? "fresh" : "stale";
  return '<div class="stamp ' + cls + '">확인<b>' + md + " " + hm + "</b></div>";
}

// ── 그날 값 (선택한 품종) ────────────────────────────────────
function heroHTML(kind) {
  var s = series(kind, 0);
  if (!s.length) return '<div class="hero"><div class="hero-kind">' + kind +
                        '</div><div class="hero-price">-</div></div>';
  var v = s[s.length - 1][2];
  var c = change(kind);

  // 그날 경매에 없던 품종이면 언제 값인지 밝힌다. 안 그러면 옛 값을 최신 값으로 본다.
  var soldDate = s[s.length - 1][0];
  var stale = soldDate !== state.dates[state.dates.length - 1]
    ? '<div class="stale-note">' + fmtDay(state.dates[state.dates.length - 1]) +
      " 경매에 없음 · 아래는 " + fmtDay(soldDate) + " 값</div>" : "";

  var diff = '<div class="hero-diff same">견줄 이전 경매가 없습니다</div>';
  // 직전 거래가 보름도 더 전이면 견주는 것이 뜻이 없다. 오름·내림으로 적으면 오해한다.
  if (c && daysBetween(c.prevDate, soldDate) > 15) {
    diff = '<div class="hero-diff same">오랜만에 나온 경매입니다</div>' +
           '<div class="hero-prev">직전은 ' + relDay(c.prevDate) + " " + won(c.prev) + "원</div>";
  } else if (c) {
    var cls = c.diff > 0 ? "up" : c.diff < 0 ? "down" : "same";
    var mark = c.diff > 0 ? "▲" : c.diff < 0 ? "▼" : "―";
    var word = c.diff === 0 ? "변동 없음" : won(Math.abs(c.diff)) + "원 " + (c.diff > 0 ? "오름" : "내림");
    // 등락과 견준 값은 결이 다르니 줄을 나눈다. 한 줄에 넣으면 좁은 폰에서 넘친다.
    diff = '<div class="hero-diff ' + cls + '">' + mark + " " + word + "</div>" +
           '<div class="hero-prev">' + relDay(c.prevDate) + " " + won(c.prev) + "원과 견줌</div>";
  }

  return '<div class="hero">' +
    '<div class="hero-kind">' + kind + "</div>" + stale +
    '<div class="hero-price">' + won(v.avg) + "<span>원</span></div>" +
    '<div class="hero-unit">1' + v.unit + "당 평균가</div>" +
    diff +
    // 가격끼리 나란히
    '<div class="pair">' +
      "<div><b>" + won(v.high) + "</b><span>최고가</span></div>" +
      "<div><b>" + won(v.low) + "</b><span>최저가</span></div>" +
    "</div>" +
    // 물량은 결이 다르니 아래 단으로
    '<div class="volume"><span>출하량</span><b>' + won(v.volume) + " " + v.unit + "</b></div>" +
  "</div>";
}

// ── 판단 ────────────────────────────────────────────────────
function verdictHTML(kind) {
  var s = series(kind, 30);
  // 값이 두세 개뿐이면 순위를 매겨봐야 뜻이 없다. 왜 판단을 못 하는지 밝힌다.
  if (s.length < 3) {
    return '<div class="verdict"><div class="line1">아직 견줄 자료가 모자랍니다</div>' +
           '<div class="line2">최근 한 달 ' + kind + " 경매가 " + s.length +
           "번뿐입니다. 경매가 쌓이면 높은지 낮은지 알려드립니다.</div></div>";
  }
  var cur = s[s.length - 1][1];
  var vals = s.map(function (x) { return x[1]; });
  var rank = vals.slice().sort(function (a, b) { return b - a; }).indexOf(cur) + 1;
  var mean = Math.round(vals.reduce(function (a, b) { return a + b; }, 0) / vals.length);
  var gap = cur - mean;
  var pct = Math.round(gap / mean * 1000) / 10;

  // 무엇의 몇 번인지 밝힌다. 숫자만 있으면 무슨 말인지 알 수 없다.
  var head;
  if (rank === 1) head = "한 달간 경매 " + vals.length + "번 중 가장 높습니다";
  else if (rank <= 3) head = "한 달간 경매 " + vals.length + "번 중 " + rank + "번째로 높습니다";
  else if (rank > vals.length - 3) head = "한 달간 경매 " + vals.length + "번 중 " + rank + "번째로 낮은 편입니다";
  else head = "한 달간 경매 " + vals.length + "번 중 " + rank + "번째입니다";

  var tail = gap === 0 ? "한 달 평균과 같습니다"
    : "한 달 평균 " + won(mean) + "원보다 <b>" + won(Math.abs(gap)) + "원 " +
      (gap > 0 ? "높음" : "낮음") + "</b> (" + (gap > 0 ? "+" : "") + pct + "%)";

  return '<div class="verdict"><div class="line1">' + head +
         '</div><div class="line2">' + tail + "</div></div>";
}

// ── 그래프 (외부 라이브러리 없이 SVG 직접 그림) ────────────────
function chartHTML(kind, days) {
  var s = series(kind, days);
  // 점이 하나뿐이면 선을 그릴 수 없다. 왜 안 나오는지, 어떻게 하면 보이는지 알려준다.
  if (s.length < 2) {
    var span = RANGES.filter(function (r) { return r.key === days; })[0];
    var label = span ? span.label : days + "일";
    return '<div class="empty">' + label + " 안에 " + kind + " 경매가 " +
           (s.length ? "한 번뿐이라" : "없어") + " 흐름을 그릴 수 없습니다." +
           "<span>기간을 더 길게 눌러 보세요.</span></div>";
  }

  var W = 480, H = 210, L = 54, R = 10, T = 12, B = 28;
  var vals = s.map(function (x) { return x[1]; });
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  var pad = (hi - lo) * 0.15 || hi * 0.05 || 1;
  lo = Math.max(0, lo - pad); hi = hi + pad;

  var t0 = new Date(s[0][0]).getTime(), t1 = new Date(s[s.length - 1][0]).getTime();
  var span = t1 - t0 || 1;
  var x = function (d) { return L + (new Date(d).getTime() - t0) / span * (W - L - R); };
  var y = function (v) { return T + (1 - (v - lo) / (hi - lo)) * (H - T - B); };

  // 경매가 열흘 넘게 비면 선을 끊는다. 이어 그리면 없던 흐름이 보인다.
  var segs = [], cur = [];
  s.forEach(function (p, i) {
    if (i > 0 && daysBetween(s[i - 1][0], p[0]) > 10) { segs.push(cur); cur = []; }
    cur.push(p);
  });
  segs.push(cur);

  var paths = segs.filter(function (g) { return g.length > 1; }).map(function (g) {
    return '<path d="' + g.map(function (p, i) {
      return (i ? "L" : "M") + x(p[0]).toFixed(1) + " " + y(p[1]).toFixed(1);
    }).join(" ") + '" fill="none" stroke="#111" stroke-width="2.2" stroke-linejoin="round"/>';
  }).join("");

  // 값 폭이 좁을 때 천 단위로 반올림하면 눈금이 다 같은 숫자가 된다. 그때는 소수로 적는다.
  var fmtY = (hi - lo) >= 4000
    ? function (v) { return Math.round(v / 1000) + "천"; }
    : function (v) { return (Math.round(v / 100) / 10).toFixed(1) + "천"; };

  var grid = "";
  for (var i = 0; i <= 3; i++) {
    var v = lo + (hi - lo) * i / 3, gy = y(v);
    grid += '<line x1="' + L + '" y1="' + gy.toFixed(1) + '" x2="' + (W - R) + '" y2="' + gy.toFixed(1) +
            '" stroke="#eee"/><text x="' + (L - 7) + '" y="' + (gy + 5).toFixed(1) +
            '" text-anchor="end" font-size="14" fill="#777">' + fmtY(v) + "</text>";
  }

  // 가로축 눈금. 양 끝만 있으면 석 달·1년 그래프에서 중간이 언제인지 알 수 없다.
  // 1년은 날짜까지 적으면 빽빽해서 월만 적는다.
  var byMonth = days >= 180;
  var f = function (d) {
    var p = d.split("-");
    return byMonth ? +p[1] + "월" : +p[1] + "/" + +p[2];
  };

  var tickCount = days <= 7 ? 3 : days <= 90 ? 4 : 5;
  var seen = {}, axis = "";
  for (var t = 0; t < tickCount; t++) {
    var target = t0 + span * t / (tickCount - 1);
    // 눈금 자리에서 가장 가까운 실제 경매일을 찍는다
    var near = s.reduce(function (a, b) {
      return Math.abs(new Date(b[0]) - target) < Math.abs(new Date(a[0]) - target) ? b : a;
    });
    var text = f(near[0]);
    if (seen[text]) continue;      // 같은 달이 겹치면 한 번만
    seen[text] = 1;

    var tx = x(near[0]);
    var anchor = t === 0 ? "start" : t === tickCount - 1 ? "end" : "middle";
    if (t === 0) tx = L;
    if (t === tickCount - 1) tx = W - R;

    axis += '<line x1="' + tx.toFixed(1) + '" y1="' + T + '" x2="' + tx.toFixed(1) + '" y2="' +
            (H - B) + '" stroke="#f2f2f2"/>' +
            '<text x="' + tx.toFixed(1) + '" y="' + (H - 6) + '" text-anchor="' + anchor +
            '" font-size="14" fill="#777">' + text + "</text>";
  }

  var last = s[s.length - 1];
  var dot = '<circle cx="' + x(last[0]).toFixed(1) + '" cy="' + y(last[1]).toFixed(1) + '" r="4.5" fill="#c62828"/>';

  return '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + kind +
         ' 시세 추이"><rect width="' + W + '" height="' + H + '" fill="#fff"/>' +
         grid + paths + dot + axis + "</svg>";
}

// ── 기간 요약 (네 칸) ────────────────────────────────────────
function quadHTML(kind, days) {
  var s = series(kind, days);
  if (!s.length) return "";
  var vals = s.map(function (x) { return x[1]; });
  var highs = s.map(function (x) { return x[2].high; }).filter(function (v) { return v != null; });
  var lows = s.map(function (x) { return x[2].low; }).filter(function (v) { return v != null; });
  var mean = Math.round(vals.reduce(function (a, b) { return a + b; }, 0) / vals.length);

  var span = RANGES.filter(function (r) { return r.key === days; })[0];
  var label = span ? span.label : days + "일";
  var unit = s[s.length - 1][2].unit;
  var vol = s.reduce(function (a, x) { return a + (x[2].volume || 0); }, 0);

  // 가격 셋은 나란히, 규모(횟수·물량)는 성격이 달라 아래 단으로 내린다
  return '<div class="quad">' +
    "<div><b>" + won(mean) + "</b><span>평균</span></div>" +
    "<div><b>" + won(highs.length ? Math.max.apply(null, highs) : null) + "</b><span>최고</span></div>" +
    "<div><b>" + won(lows.length ? Math.min.apply(null, lows) : null) + "</b><span>최저</span></div>" +
    "</div>" +
    '<div class="count"><span>' + label + " 경매 횟수</span><b>" + s.length + "번</b></div>" +
    '<div class="count last"><span>' + label + " 거래 물량</span><b>" + won(vol) + " " + unit + "</b></div>";
}

// ── 그날 전 품종 ───────────────────────────────────────────
function tableHTML(kinds) {
  var last = state.dates[state.dates.length - 1];
  var rows = kinds.map(function (k) {
    var v = state.days[last][k];
    // 그날 경매에 없던 품종도 줄은 남긴다. 빠지면 버튼 목록과 어긋난다.
    if (!v) {
      return "<tr data-row='" + k + "'" + (k === state.kind ? ' class="on"' : "") + "><td>" + flatName(k) +
             '</td><td colspan="3" class="flat">경매 없음</td></tr>';
    }
    var c = change(k);
    var cls = "flat", txt = "―";
    if (c && c.diff !== 0) {
      cls = c.diff > 0 ? "up" : "down";
      txt = (c.diff > 0 ? "▲" : "▼") + won(Math.abs(c.diff));
    }
    // 단위가 다른 품종(홍고추는 kg)만 이름 뒤에 밝힌다. 안 그러면 싼 값으로 오해한다.
    var name = flatName(k) + (v.unit !== "근" ? ' <i>' + v.unit + "</i>" : "");
    // 가격 둘을 붙여 두고, 성격이 다른 물량은 맨 끝에 둔다.
    // 최고·최저는 품종을 고르면 위에 크게 나오므로 표에는 넣지 않는다.
    return "<tr data-row='" + k + "'" + (k === state.kind ? ' class="on"' : "") + "><td>" +
           name + "</td><td>" + won(v.avg) + '</td><td class="' + cls + '">' + txt +
           '</td><td class="vol">' + won(v.volume) + "</td></tr>";
  }).join("");

  return "<table><thead><tr><th>품종</th><th>평균가</th><th>등락</th><th>물량</th></tr></thead>" +
         "<tbody>" + rows + "</tbody></table>" +
         '<p class="unit-note">줄을 누르면 그 품종의 최고·최저와 그래프를 봅니다.<br>' +
         "값은 1근당 가격과 근 단위 물량입니다. <i>kg</i> 표시가 붙은 홍고추만 kg입니다.</p>";
}

function flowHTML() {
  return chartHTML(state.kind, state.range) + quadHTML(state.kind, state.range);
}

// 기간을 바꿀 때 화면 전체를 다시 그리면 보던 자리가 흔들린다. 그래프 칸만 갈아 끼운다.
function setRange(r) {
  state.range = r;
  remember("range", r);
  document.getElementById("flow").innerHTML = flowHTML();
  document.querySelectorAll("[data-range]").forEach(function (b) {
    b.setAttribute("aria-pressed", +b.dataset.range === r);
  });
}

// ── 조립 ────────────────────────────────────────────────────
function render() {
  var kinds = kindsAvailable();
  if (state.kind == null || kinds.indexOf(state.kind) < 0) {
    // 지난번에 보던 품종이 있으면 그것부터, 없으면 주력 품종
    var saved = recall("kind");
    state.kind = saved && kinds.indexOf(saved) >= 0 ? saved : kinds[0];
  }
  var last = state.dates[state.dates.length - 1];

  var html =
    "<header><div class='head-row'><div class='date'>" + fmtDate(last) + "</div>" +
    stampHTML() + "</div>" +
    "<div class='sub-head'>" + state.marketName + " 경매</div></header>" +
    alertHTML() +

    "<section><div class='label'>품종 고르기</div><div class='picker'>" +
    kinds.map(function (k) {
      return "<button data-kind='" + k + "' aria-pressed='" + (k === state.kind) + "'>" + shortName(k) + "</button>";
    }).join("") + "</div></section>" +

    "<section><div class='label'>" + fmtDay(last) + " 시세</div>" + heroHTML(state.kind) + "</section>" +

    "<section>" + verdictHTML(state.kind) + "</section>" +

    "<section><div class='label'>시세 흐름 · 1" + unitOf(state.kind) + "당</div><div class='ranges'>" +
    RANGES.map(function (r) {
      return "<button data-range='" + r.key + "' aria-pressed='" + (r.key === state.range) + "'>" + r.label + "</button>";
    }).join("") + "</div><div id='flow'>" + flowHTML() + "</div></section>" +

    "<section><div class='label'>" + fmtDay(last) + " 전 품종</div>" + tableHTML(kinds) + "</section>" +

    "<footer>자료 : " + state.marketName + " 공식 시세표<br>" +
    "보유 " + state.dates.length + "일치 (" + state.dates[0] + " 부터)</footer>";

  var app = document.getElementById("app");
  app.innerHTML = html;
  app.querySelectorAll("[data-kind]").forEach(function (b) {
    b.onclick = function () { pick(b.dataset.kind); };
  });
  app.querySelectorAll("[data-range]").forEach(function (b) {
    b.onclick = function () { setRange(+b.dataset.range); };
  });
  // 표에서 줄을 눌러도 그 품종으로 바뀐다
  app.querySelectorAll("[data-row]").forEach(function (tr) {
    tr.onclick = function () {
      pick(tr.dataset.row);
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
  });
}

fetch("prices.json?t=" + Date.now())
  .then(function (r) { return r.json(); })
  .then(function (store) {
    var m = store.markets.seoandong;
    if (!m || !Object.keys(m.days).length) throw new Error("자료 없음");
    state.days = m.days;
    state.dates = Object.keys(m.days).sort();
    state.marketName = m.name;
    state.updated = store.updated || "";
    state.status = store.status || null;
    var savedRange = +recall("range");
    if (RANGES.some(function (r) { return r.key === savedRange; })) state.range = savedRange;
    render();
  })
  .catch(function (e) {
    document.getElementById("app").innerHTML =
      "<div class='alert red'>시세를 불러오지 못했습니다" +
      "<span class='tell'>인터넷 연결을 확인하고 새로고침해 주세요.<br>" +
      "그래도 안 되면 이 화면을 아들에게 보여주세요.</span>" +
      "<span class='why'>" + e.message + "</span></div>";
  });
</script>
</body>
</html>
